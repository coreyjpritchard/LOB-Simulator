[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lobsim"
version = "0.1.0"
description = "Zero-intelligence limit order book in the Smith, Farmer, Gillemot and Krishnamurthy (2003) style, measured against Binance BTC/USDT and ETH/USDT."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "sortedcontainers>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
capture = ["websockets>=12", "pandas>=2.2"]

[tool.setuptools.packages.find]
include = ["lobsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
